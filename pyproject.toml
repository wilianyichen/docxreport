[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docxreport"
version = "0.3.0"
description = "Template-driven experiment-report builder: build, screenshot-safe revise, enrich, validate and export DOCX reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "docxreport contributors" }]
keywords = ["docx", "report", "template", "ooxml", "python-docx", "lab-report", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "python-docx>=1.0",
    "PyYAML>=6.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
# Helpers used by experiment notebooks (src/labkit): plotting, metrics tables.
lab = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
]
# PDF export drives Microsoft Word through COM.
pdf = ["pywin32>=306; sys_platform == 'win32'"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.0",
    "ruff>=0.5",
    "pre-commit>=3.0",
    # tomllib only joined the stdlib in 3.11; the contract tests read pyproject.toml
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
docx-report = "docx_report.cli:main"

[project.urls]
Homepage = "https://github.com/wilianyichen/docxreport"
Issues = "https://github.com/wilianyichen/docxreport/issues"
Changelog = "https://github.com/wilianyichen/docxreport/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:docx_report.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["_tmp", "examples/out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter, not the linter
    "B008",  # argparse default factories are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["docx_report"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
